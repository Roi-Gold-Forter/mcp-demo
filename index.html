<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forter MCP Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0c0f;
      --surface: #111418;
      --surface2: #181d23;
      --border: #1e2730;
      --border-bright: #2a3540;
      --accent: #00d4ff;
      --accent-dim: rgba(0, 212, 255, 0.12);
      --accent-glow: rgba(0, 212, 255, 0.3);
      --green: #00e676;
      --green-dim: rgba(0, 230, 118, 0.12);
      --red: #ff4444;
      --amber: #ffab40;
      --amber-dim: rgba(255, 171, 64, 0.12);
      --text: #c8d6e0;
      --text-dim: #5a7080;
      --text-bright: #e8f4ff;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow-x: hidden;
    }

    /* Subtle grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 255, 0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      backdrop-filter: blur(10px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -1px;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .logo-text {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-bright);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .logo-text span {
      color: var(--text-dim);
      font-weight: 300;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-bright);
      background: var(--surface2);
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
    }

    .status-pill.connected {
      border-color: var(--green);
      background: var(--green-dim);
      color: var(--green);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: all 0.3s ease;
    }

    .status-pill.connected .status-dot {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse-dot 2s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── CONNECT BUTTON (topbar) ── */
    .btn-connect {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 6px;
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-connect::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--accent-dim);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .btn-connect:hover::before { opacity: 1; }
    .btn-connect:hover { box-shadow: 0 0 16px var(--accent-glow); }

    .btn-connect:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-connect.connected {
      border-color: var(--green);
      color: var(--green);
    }

    .btn-connect.connected::before {
      background: var(--green-dim);
    }

    .btn-connect.connected:hover {
      box-shadow: 0 0 16px rgba(0, 230, 118, 0.3);
    }

    /* ── MAIN ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
      gap: 32px;
    }

    /* ── CONNECTION BANNER ── */
    .connection-banner {
      width: 100%;
      max-width: 760px;
      padding: 20px 28px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      gap: 16px;
      animation: slide-down 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .connection-banner.success {
      border-color: var(--green);
      background: var(--green-dim);
    }

    .connection-banner.error {
      border-color: var(--red);
      background: rgba(255, 68, 68, 0.08);
    }

    .connection-banner.loading {
      border-color: var(--amber);
      background: var(--amber-dim);
    }

    @keyframes slide-down {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .banner-icon { font-size: 28px; line-height: 1; }

    .banner-content { flex: 1; }

    .banner-title {
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .connection-banner.success .banner-title { color: var(--green); }
    .connection-banner.error .banner-title   { color: var(--red); }
    .connection-banner.loading .banner-title { color: var(--amber); }

    .banner-detail {
      font-family: var(--mono);
      font-size: 14px;
      color: var(--text-bright);
    }

    /* ── CONSOLE CARD ── */
    .console-card {
      width: 100%;
      max-width: 760px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface2);
    }

    .card-dots {
      display: flex;
      gap: 6px;
    }

    .card-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .dot-red    { background: #ff5f57; }
    .dot-amber  { background: #febc2e; }
    .dot-green  { background: #28c840; }

    .card-title {
      flex: 1;
      text-align: center;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .card-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .field-label {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 16px;
      background: var(--bg);
      border: 1px solid var(--border-bright);
      border-radius: 8px;
      color: var(--text-bright);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.65;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    textarea::placeholder {
      color: var(--text-dim);
      font-style: italic;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .char-counter {
      text-align: right;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      margin-top: -8px;
    }

    .char-counter.warn { color: var(--amber); }
    .char-counter.over { color: var(--red); }

    .btn-submit {
      align-self: flex-end;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 28px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #0a0c0f;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-submit:hover {
      background: #33deff;
      box-shadow: 0 0 24px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-submit:active { transform: translateY(0); }

    .btn-submit:disabled {
      background: var(--border-bright);
      color: var(--text-dim);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-submit .spin {
      display: inline-block;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── RESPONSE AREA ── */
    .response-section {
      width: 100%;
      max-width: 760px;
      animation: fade-in 0.4s ease;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .response-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .response-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .response-box {
      width: 100%;
      padding: 20px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.75;
      color: var(--text-bright);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .response-box.processing {
      border-color: var(--amber);
      background: var(--amber-dim);
      color: var(--amber);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .processing-dots span {
      display: inline-block;
      animation: blink 1.2s infinite;
    }

    .processing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .processing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; }
      40%            { opacity: 1; }
    }

    /* ── FOOTER ── */
    footer {
      padding: 16px 28px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    footer .endpoint {
      color: var(--accent);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="logo">
        <div class="logo-mark">F</div>
        <div class="logo-text">Forter <span>/ MCP Console</span></div>
      </div>
      <div class="topbar-right">
        <div class="status-pill" id="statusPill">
          <div class="status-dot"></div>
          <span id="statusText">Disconnected</span>
        </div>
        <button class="btn-connect" id="connectBtn" onclick="handleConnect()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M6 3v3l2 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Connect
        </button>
      </div>
    </header>

    <!-- MAIN -->
    <main class="main" id="mainContent">

      <!-- Connection banner (shown after connect attempt) -->
      <div id="connectionBanner" style="display:none; width:100%; max-width:760px;"></div>

      <!-- Console card -->
      <div class="console-card">
        <div class="card-header">
          <div class="card-dots">
            <div class="card-dot dot-red"></div>
            <div class="card-dot dot-amber"></div>
            <div class="card-dot dot-green"></div>
          </div>
          <div class="card-title">mcp://forter.com/v1 — query console</div>
        </div>
        <div class="card-body">
          <div>
            <div class="field-label">Prompt</div>
            <textarea
              id="promptInput"
              maxlength="2024"
              placeholder="Enter your query for the Forter MCP…"
              oninput="updateCharCount()"
            ></textarea>
            <div class="char-counter" id="charCounter">0 / 2024</div>
          </div>
          <button class="btn-submit" id="submitBtn" onclick="handleSubmit()" disabled>
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Submit to MCP
          </button>
        </div>
      </div>

      <!-- Response area -->
      <div class="response-section" id="responseSection" style="display:none;">
        <div class="response-label">⟶ MCP Response</div>
        <div class="response-box" id="responseBox"></div>
      </div>

    </main>

    <!-- FOOTER -->
    <footer>
      <span>Forter MCP Console · v1.0</span>
      <span class="endpoint">https://mcp.forter.com/v1</span>
    </footer>

  </div>

  <script>
    // ── STATE ──
    let isConnected = false;
    let siteInfo = null;
    let conversationHistory = [];

    // ── CHAR COUNTER ──
    function updateCharCount() {
      const ta = document.getElementById('promptInput');
      const len = ta.value.length;
      const counter = document.getElementById('charCounter');
      counter.textContent = `${len} / 2024`;
      counter.className = 'char-counter' +
        (len > 1900 ? ' over' : len > 1700 ? ' warn' : '');
    }

    // ── UI HELPERS ──
    function setConnectBtn(state) {
      const btn = document.getElementById('connectBtn');
      const statusPill = document.getElementById('statusPill');
      const statusText = document.getElementById('statusText');

      if (state === 'loading') {
        btn.disabled = true;
        btn.innerHTML = `<span class="spin">⟳</span> Connecting…`;
      } else if (state === 'connected') {
        btn.disabled = false;
        btn.className = 'btn-connect connected';
        btn.innerHTML = `✓ Connected`;
        statusPill.className = 'status-pill connected';
        statusText.textContent = 'Connected';
        document.getElementById('submitBtn').disabled = false;
      } else {
        btn.disabled = false;
        btn.className = 'btn-connect';
        btn.innerHTML = `
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <circle cx="6" cy="6" r="5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M6 3v3l2 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Connect`;
        statusPill.className = 'status-pill';
        statusText.textContent = 'Disconnected';
        document.getElementById('submitBtn').disabled = true;
      }
    }

    function showBanner(type, icon, title, detail) {
      const wrap = document.getElementById('connectionBanner');
      wrap.style.display = 'block';
      wrap.innerHTML = `
        <div class="connection-banner ${type}">
          <div class="banner-icon">${icon}</div>
          <div class="banner-content">
            <div class="banner-title">${title}</div>
            <div class="banner-detail">${detail}</div>
          </div>
        </div>`;
    }

    function showResponse(html, processing = false) {
      const sec = document.getElementById('responseSection');
      const box = document.getElementById('responseBox');
      sec.style.display = 'block';
      box.className = 'response-box' + (processing ? ' processing' : '');
      box.innerHTML = html;
      sec.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ── CALL CLAUDE API (with Forter MCP) ──
    async function callForterMCP(userMessage) {
      conversationHistory.push({ role: 'user', content: userMessage });

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: 'You are a helpful assistant with access to the Forter MCP server. Use the available MCP tools to answer user queries. When asked to identify the site or user, call the whoami tool.',
          messages: conversationHistory,
          mcp_servers: [
            {
              type: 'url',
              url: 'https://mcp.forter.com/v1',
              name: 'forter-mcp'
            }
          ]
        })
      });

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err.error?.message || `HTTP ${response.status}`);
      }

      const data = await response.json();

      // Extract text from response
      const textBlocks = (data.content || [])
        .filter(b => b.type === 'text')
        .map(b => b.text)
        .join('\n');

      // Save assistant turn to history
      if (data.content && data.content.length) {
        conversationHistory.push({ role: 'assistant', content: data.content });
      }

      return textBlocks || '(No text response from MCP)';
    }

    // ── CONNECT ──
    async function handleConnect() {
      if (isConnected) return;

      setConnectBtn('loading');
      showBanner('loading', '⚡', 'Connecting', 'Reaching Forter MCP at https://mcp.forter.com/v1 …');

      try {
        conversationHistory = []; // fresh session

        const reply = await callForterMCP(
          'Please call the whoami tool and tell me: which site am I connected to and who is the current user? Be concise.'
        );

        siteInfo = reply;
        isConnected = true;
        setConnectBtn('connected');
        showBanner(
          'success',
          '🟢',
          'Connected · Forter MCP',
          reply
        );

      } catch (err) {
        isConnected = false;
        setConnectBtn('idle');
        showBanner(
          'error',
          '🔴',
          'Connection Failed',
          err.message || 'Could not reach the Forter MCP. Check your network and credentials.'
        );
      }
    }

    // ── SUBMIT ──
    async function handleSubmit() {
      const prompt = document.getElementById('promptInput').value.trim();
      if (!prompt) return;
      if (!isConnected) {
        showBanner('error', '⚠️', 'Not Connected', 'Please connect to the Forter MCP first.');
        return;
      }

      // Processing state
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spin">⟳</span> Processing…`;

      showResponse(
        `<span>⏳</span> <span>MCP is processing your request<span class="processing-dots"><span>.</span><span>.</span><span>.</span></span></span>`,
        true
      );

      try {
        const reply = await callForterMCP(prompt);
        showResponse(escapeHtml(reply));
      } catch (err) {
        showResponse(`<span style="color:var(--red)">❌ Error: ${escapeHtml(err.message)}</span>`);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M2 7h10M8 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Submit to MCP`;
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Allow Ctrl+Enter to submit
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('promptInput').addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') handleSubmit();
      });
    });
  </script>
</body>
</html>
